<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneDesk —— 最新版本</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/appicon.svg">
<style>
body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC",sans-serif;color:#0b0d10;background:#fff;display:grid;min-height:100vh;place-items:center}
.box{max-width:560px;padding:40px 24px;text-align:center}
svg.mark{height:56px;width:56px}
h1{font-size:24px;letter-spacing:-.02em;margin:18px 0 6px}
p{color:#3d434c;margin:6px 0}
ul{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:10px}
a.build{display:block;border:1px solid #e4e9f2;border-radius:12px;padding:12px 16px;font-weight:650;color:#0b0d10;text-decoration:none}
a.build:hover{border-color:#0F7FFF;background:rgba(15,127,255,.08)}
a.build.hot{border-color:#0F7FFF;background:rgba(15,127,255,.08)}
a.build small{display:block;font-weight:450;color:#6b7280}
.spin{width:26px;height:26px;margin:24px auto 0;border:3px solid #e4e9f2;border-top-color:#0F7FFF;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.foot{margin-top:26px;font-size:14px;color:#6b7280}
a{color:#0b62c4}
</style>
</head>
<body>
<div class="box">
  <svg class="mark" viewBox="0 0 256 256" aria-hidden="true"><rect x="18" y="18" width="132" height="132" rx="26" fill="#0F1115"/><rect x="166" y="18" width="72" height="72" rx="20" fill="#0F7FFF"/><rect x="18" y="166" width="72" height="72" rx="20" fill="#0F7FFF"/><rect x="166" y="166" width="72" height="72" rx="20" fill="#0F7FFF"/></svg>
  <h1 id="t">OneDesk 最新版本</h1>
  <p id="s">正在为这台电脑挑选合适的构建……</p>
  <div class="spin" id="spin"></div>
  <ul id="list" hidden></ul>
  <p class="foot">全部构建同步发布于 <a id="gh" href="https://github.com/futuremeng/OneDesk/releases/latest">GitHub</a>
  与 <a href="https://atomgit.com/futuremeng/OneDesk/releases">AtomGit 镜像</a>。</p>
</div>
<script>
(function(){
  var API='https://api.github.com/repos/futuremeng/OneDesk/releases/latest';
  var UA=navigator.userAgent;
  var os=/Windows/.test(UA)?'win':/Macintosh|Mac OS X/.test(UA)?'mac':/Linux|Android/.test(UA)?'linux':null;
  var arm=null; // true=ARM/Apple Silicon, false=x86_64, null=unknown
  if(os==='win')arm=/arm/i.test(UA)?true:/x64|WOW64|Win64/.test(UA)?false:null; // Windows UA carries the arch
  function detect(){
    // UA-CH high-entropy hints: reliable arch on Chrome/Edge; other browsers keep arm=null.
    return new Promise(function(res){
      if(!navigator.userAgentData||!navigator.userAgentData.getHighEntropyValues)return res();
      var done=false,finish=function(){if(!done){done=true;res();}};
      setTimeout(finish,1500);
      navigator.userAgentData.getHighEntropyValues(['architecture']).then(function(v){
        var a=(v.architecture||'').toLowerCase();
        if(a==='arm')arm=true;else if(a==='x86')arm=false;
        finish();
      },finish);
    });
  }
  function rank(n){n=n.toLowerCase();
    if(os==='mac')return /\.dmg$/.test(n)&&(arm===true?/arm64|aarch64/.test(n):!/arm64|aarch64/.test(n))?0:1;
    if(os==='win')return /\.exe$/.test(n)&&(arm===true?/arm64/.test(n):!/arm64|aarch64/.test(n))?0:1;
    if(os==='linux')return /\.deb$/.test(n)?0:/AppImage/i.test(n)?1:2;
    return 2;}
  function label(n){
    if(/arm64|aarch64/i.test(n))return os==='mac'?'Apple Silicon（M 系列芯片）':'ARM64';
    if(os==='mac'&&/\.dmg$|\.zip$/.test(n))return 'Intel（x86_64）';
    return '';
  }
  detect().then(function(){return fetch(API,{headers:{Accept:'application/vnd.github+json'}})})
  .then(function(r){if(!r.ok)throw r.status;return r.json()})
  .then(function(j){
    var ver=j.tag_name||'';
    document.getElementById('t').textContent='OneDesk '+(ver||'最新版');
    document.getElementById('spin').hidden=true;
    var list=document.getElementById('list');list.hidden=false;
    var assets=(j.assets||[]).slice().sort(function(a,b){return rank(a.name)-rank(b.name)});
    if(!assets.length)throw 'no assets';
    assets.forEach(function(a,i){
      var li=document.createElement('li'),aEl=document.createElement('a');
      aEl.className='build'+(i===0&&rank(a.name)===0&&arm!==null?' hot':'');
      aEl.href=a.browser_download_url;
      aEl.textContent=a.name;
      var kb=Math.round((a.size||0)/1024);
      var s=document.createElement('small');s.textContent=(kb>1024?(kb/1024).toFixed(1)+' MB':kb+' KB')+(label(a.name)?' · '+label(a.name):'')+(i===0&&rank(a.name)===0&&arm!==null?' · 与本机匹配':'');
      aEl.appendChild(s);li.appendChild(aEl);list.appendChild(li);
    });
    if((os==='win'||os==='mac')&&arm!==null&&rank(assets[0].name)===0){
      // confident match: go straight to it
      location.replace(assets[0].browser_download_url);
    }
    document.getElementById('s').textContent='请在下方选择构建——下载将从 GitHub 开始。'+(os==='mac'&&arm===null?'（浏览器无法确认芯片架构：M 系列请选 arm64）':'');
  })
  .catch(function(){
    document.getElementById('spin').hidden=true;
    document.getElementById('s').innerHTML='当前网络无法访问 GitHub API,可直接打开发布页面:<a href="https://github.com/futuremeng/OneDesk/releases/latest">github.com/futuremeng/OneDesk/releases/latest</a>';
  });
})();
</script>
</body>
</html>
